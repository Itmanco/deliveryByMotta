<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Customer Update</title>
<link th:href="@{/css/common.css}" rel="stylesheet" type="text/css">
</head>
<body>
	<div id="header" th:insert="~{header}"></div>
	<div class="container-form">
		<h2>★★★　お客様情報更新　★★★</h2>
		
		<form th:action="@{/updateCustomer}" method="post" th:object="${customerModel}">
			
			<div class="comments">
		    	<div th:text="${message}"></div>
		    	<div th:if="${#fields.hasErrors('login_id')}" th:errors="*{login_id}" class="errors"></div>
				<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="errors"></div>
				<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="errors"></div>
				
				<div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="errors"></div>
				<div th:if="${#fields.hasErrors('zip')}" th:errors="*{zip}" class="errors"></div>
				<div th:if="${#fields.hasErrors('address1')}" th:errors="*{address1}" class="errors"></div>
				<div th:if="${#fields.hasErrors('question')}" th:errors="*{question}" class="errors"></div>
				<div th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}" class="errors"></div>
		    </div>	
		    
		    <div class="form-group">
	            <span id="caption" th:text="${'お客様ID:'}"></span>
	            <span class="display-field" th:text="*{customer_id}"></span>
	             <input type="hidden" th:field="*{customer_id}">
	        </div>
	         <div class="form-group">
	            <span id="caption" th:text="${'LoginID:'}"></span>
	            <input type="text" th:field="*{login_id}" th:errorclass="err-field">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'お名前:'}"></span>
	            <input type="text" th:field="*{name}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'パスワード:'}"></span>
	            <input type="password" th:field="*{password}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'電話番号:'}"></span>
	            <input type="number" th:field="*{phone}" placeholder="ハイフンなし">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'郵便番号:'}"></span>
	            <input type="number" th:field="*{zip}" placeholder="ハイフンなし">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'住所１:'}"></span>
	            <input type="text" th:field="*{address1}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'住所２:'}"></span>
	            <input type="text" th:field="*{address2}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'秘密の質問:'}"></span>
	            <input type="text" th:field="*{question}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'秘密の質問の答え:'}"></span>
	            <input type="text" th:field="*{answer}">
	        </div>
	        <div class="form-group">
	            <span id="caption" th:text="${'ポイント:'}"></span>
	            <span class="display-field" th:text="*{point}"></span>
	             <input type="hidden" th:field="*{point}">
	        </div>
	        <div class="actions">
	            <button type="submit">登録</button>
	        </div>
	    </form>    
	</div>
	<footer id="page-footer" th:replace="~{footer}"></footer>
</body>
</html>
