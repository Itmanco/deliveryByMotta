<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Shops</title>
<link th:href="@{/css/common.css}" rel="stylesheet" type="text/css">
<script th:src="@{/js/shop_map.js}"></script>
</head>
<body>
<div id="header" th:insert="~{header}"></div>

<div id="contents_main">
    <div class="container-form">
        <h2>★★★　店舗情報　★★★</h2>
        
        <div class="shop-content-wrapper"> 
            
            <div class="shop-table-area">
                <table th:if="${!#lists.isEmpty(shopList)}">
                    <thead>
                        <tr>				
                            <th class="hide-on-small">ID</th>
                            <th>ショップ名</th>
                            <th>Phone</th>
                            <th class="hide-on-small">〒</th>
                            <th>住所</th>
                            <th class="hide-on-small">ひとこと</th>
                            <th>Map</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="shop : ${shopList}" th:object="${shop}">
                            <td class="hide-on-small" th:text="*{shop_id}"></td>
                            <td th:text="*{shop_name}"></td>
                            <td th:text="${@utils.formatJapanesePhone(shop.phone)}"></td>
                            <td class="hide-on-small" th:text="*{zip}"></td>
                            <td th:text="*{address}"></td>
                            <td class="hide-on-small" th:text="*{explanation}"></td>
                            <td>
                                <a href="#" 
                                   th:attr="data-address=*{address}, data-shop-name=*{shop_name}"
                                   onclick="updateMap(event, this)">Map</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="shop-map-area">
                <h3>選択した店舗の地図</h3>
                <iframe id="google-map-frame" 
                        width="100%" 
                        height="400" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                </iframe>
                <p id="map-status">リストから店舗を選択してください。</p>
            </div>
        </div>
    </div>
</div>
<footer id="page-footer" th:replace="~{footer}"></footer>
</body>
</html>
