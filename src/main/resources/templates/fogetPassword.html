<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Forget Password</title>
<link th:href="@{/css/common.css}" rel="stylesheet" type="text/css">
</head>
<body>
	<div id="header" th:insert="~{header}"></div>
	<div class="container">
		<h2>★★★　パスワードを忘れの時　★★★</h2>
		<div class="comments">
	    <div th:text="${message}"></div>
	    </div>
	    <div th:unless="${question != null}">
			<form th:action="@{/forget}" method="post">	
		         <div class="form-group">
		            <span id="caption" th:text="${'Login_id:'}"></span>
		            <input type="text" name="login_id" required>
		        </div>
		        <div class="actions">
		            <button type="submit">送信</button>
		        </div>
		    </form>
		</div>
		
	    <div th:if="${question != null}">
			<form th:action="@{/newPassword}" method="post">	
			    <div class="form-group">
			        <span th:text="${'秘密の質問:'}"></span>
			        
			        <span class="display-field" th:text="${question}"></span>
			        
			        <input type="hidden" name="question" th:value="${question}">
			    </div>
			    
			    <div class="form-group">
			        <span th:text="${'秘密の質問の答え:'}"></span>
			        <input type="text" name="answer" required>
			    </div>	 
			    
			    <div class="actions">
			        <input type="hidden" name="login_id" th:value="${login_id}">
			        <button type="submit">送信</button>
			    </div>
			</form>
		</div>
	</div>
	<footer id="page-footer" th:replace="~{footer}"></footer>
</body>
</html>
